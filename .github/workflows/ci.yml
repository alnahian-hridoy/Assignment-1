name: Deploy to EC2

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: self-hosted

    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Install Node.js
      uses: actions/setup-node@v3
      with:
        node-version: 22

    - name: Install PM2 if missing
      run: |
        if ! command -v pm2 &> /dev/null
        then
          sudo npm install -g pm2
        fi

    # Backend
    - name: Install Backend Dependencies
      working-directory: backend
      run: |
        npm install --global yarn
        yarn install

    - name: Create Backend .env
      working-directory: backend
      run: |
        echo "MONGO_URI=${{ secrets.MONGO_URI }}" > .env
        echo "JWT_SECRET=${{ secrets.JWT_SECRET }}" >> .env
        echo "PORT=${{ secrets.PORT }}" >> .env

    # Frontend
    - name: Install Frontend Dependencies
      working-directory: frontend
      run: yarn install

    - name: Disable CI warnings
      run: echo "CI=false" >> $GITHUB_ENV

    - name: Build Frontend
      working-directory: frontend
      run: yarn build

    # PM2 Safe Restart with error handling
    - name: Stop old processes safely
      run: |
        pm2 stop backend frontend || true
      continue-on-error: true

    - name: Start Backend
      run: |
        cd backend
        pm2 start "npm run start" --name backend --error $HOME/.pm2/logs/backend-error.log --out $HOME/.pm2/logs/backend-out.log
      continue-on-error: false

    - name: Start Frontend
      run: |
        pm2 serve frontend/build 3000 --name frontend --spa --error $HOME/.pm2/logs/frontend-error.log --out $HOME/.pm2/logs/frontend-out.log
      continue-on-error: false

    - name: Save PM2 State
      run: pm2 save

    - name: Check PM2 Status
      run: pm2 status
